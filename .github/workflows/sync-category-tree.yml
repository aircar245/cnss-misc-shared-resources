name: Sync issue category tree

on:
  push:
    branches:
      - main
    paths:
      - resource.md
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-category-tree:
    runs-on: ubuntu-latest
    steps:
      - name: Rebuild Issue Form category tree
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const base = context.payload.repository?.default_branch || 'main';
            const ref = context.sha;
            const resourcePath = 'resource.md';
            const formPath = '.github/ISSUE_TEMPLATE/resource.yml';
            const getFile = async (path, fileRef) => {
              const response = await github.rest.repos.getContent({
                owner,
                repo,
                path,
                ref: fileRef
              });
              if (Array.isArray(response.data)) return null;
              return {
                sha: response.data.sha,
                text: Buffer.from(response.data.content, 'base64').toString('utf8')
              };
            };
            const resourceFile = await getFile(resourcePath, ref);
            const formFile = await getFile(formPath, ref);
            if (!resourceFile || !formFile) {
              core.setFailed('resource.md 或 Issue Form 不是普通文件');
              return;
            }
            const paths = [];
            const markerPattern = /<!-- category:([^ ]+) -->/g;
            for (const match of resourceFile.text.matchAll(markerPattern)) {
              let decoded;
              try {
                decoded = decodeURIComponent(match[1]);
              } catch {
                continue;
              }
              const parts = decoded
                .split(' > ')
                .map((part) => part.trim())
                .filter(Boolean);
              const key = parts.join(' > ');
              if (parts.length && !paths.some((path) => path.join(' > ') === key)) {
                paths.push(parts);
              }
            }
            const roots = [];
            const findOrCreate = (nodes, name) => {
              let node = nodes.find((item) => item.name === name);
              if (!node) {
                node = { name, children: [] };
                nodes.push(node);
              }
              return node;
            };
            for (const parts of paths) {
              let nodes = roots;
              for (const part of parts) {
                const node = findOrCreate(nodes, part);
                nodes = node.children;
              }
            }
            const treeLines = [];
            const renderTree = (nodes, prefix, rootLevel) => {
              nodes.forEach((node, index) => {
                const last = index === nodes.length - 1;
                treeLines.push(rootLevel
                  ? prefix + node.name
                  : prefix + (last ? '└─ ' : '├─ ') + node.name);
                if (node.children.length) {
                  renderTree(
                    node.children,
                    rootLevel ? '' : prefix + (last ? '   ' : '│  '),
                    false
                  );
                }
              });
            };
            renderTree(roots, '', true);
            if (!treeLines.length) treeLines.push('（暂无分类）');
            const fence = String.fromCharCode(96).repeat(3) + 'text';
            const treeBlock = [
              '<!-- resource-category-tree:start -->',
              fence,
              ...treeLines,
              String.fromCharCode(96).repeat(3),
              '<!-- resource-category-tree:end -->'
            ];
            const formLines = formFile.text.split(String.fromCharCode(10));
            const startIndex = formLines.findIndex((line) => line.includes(treeBlock[0]));
            const endIndex = startIndex < 0
              ? -1
              : formLines.findIndex((line, index) =>
                  index >= startIndex && line.includes(treeBlock[treeBlock.length - 1])
                );
            let updatedForm;
            if (startIndex >= 0 && endIndex >= startIndex) {
              formLines.splice(
                startIndex,
                endIndex - startIndex + 1,
                ...treeBlock.map((line) => '        ' + line)
              );
              updatedForm = formLines.join(String.fromCharCode(10));
            } else {
              const categoryIdIndex = formLines.findIndex(
                (line) => line.trim() === 'id: category'
              );
              if (categoryIdIndex < 0) {
                core.setFailed('Issue Form 缺少 category 字段');
                return;
              }
              let categoryItemIndex = categoryIdIndex;
              while (
                categoryItemIndex > 0 &&
                !formLines[categoryItemIndex].trim().startsWith('- type:')
              ) {
                categoryItemIndex -= 1;
              }
              const markdownBlock = [
                '  - type: markdown',
                '    attributes:',
                '      value: |',
                '        当前目录结构：',
                '',
                ...treeBlock.map((line) => '        ' + line),
                ''
              ];
              formLines.splice(categoryItemIndex, 0, ...markdownBlock);
              updatedForm = formLines.join(String.fromCharCode(10));
            }
            if (updatedForm === formFile.text) {
              core.info('Issue Form 分类树已经是最新状态');
              return;
            }
            const baseRef = await github.rest.git.getRef({
              owner,
              repo,
              ref: 'heads/' + base
            });
            const branch = 'sync-category-tree-' + String(context.sha).slice(0, 12);
            let branchSha = baseRef.data.object.sha;
            try {
              const existingBranch = await github.rest.git.getRef({
                owner,
                repo,
                ref: 'heads/' + branch
              });
              branchSha = existingBranch.data.object.sha;
            } catch {
              await github.rest.git.createRef({
                owner,
                repo,
                ref: 'refs/heads/' + branch,
                sha: branchSha
              });
            }
            const branchForm = await getFile(formPath, branch);
            if (!branchForm) {
              core.setFailed('无法读取同步分支中的 Issue Form');
              return;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner,
              repo,
              path: formPath,
              message: 'Sync Issue Form category tree from resource.md',
              content: Buffer.from(updatedForm, 'utf8').toString('base64'),
              branch,
              sha: branchForm.sha
            });
            const openPrs = await github.rest.pulls.list({
              owner,
              repo,
              state: 'open',
              head: owner + ':' + branch,
              base
            });
            let pr = openPrs.data[0];
            if (!pr) {
              pr = (await github.rest.pulls.create({
                owner,
                repo,
                title: 'Sync Issue Form category tree',
                head: branch,
                base,
                body: 'Automatically rebuild the Issue Form category tree from resource.md.'
              })).data;
            }
            try {
              await github.graphql(
                'mutation($pullRequestId: ID!, $mergeMethod: PullRequestMergeMethod!) {' +
                ' enablePullRequestAutoMerge(input: { pullRequestId: $pullRequestId, mergeMethod: $mergeMethod }) {' +
                ' pullRequest { number } } }',
                {
                  pullRequestId: pr.node_id,
                  mergeMethod: 'SQUASH'
                }
              );
            } catch (error) {
              core.warning('无法开启自动合并：' + error.message);
            }
            core.info('已创建分类树同步 PR：#' + pr.number);
