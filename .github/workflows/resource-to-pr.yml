name: Generate resource pull request

on:
  issues:
    types: [opened, labeled]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  sync-title:
    if: github.event.action == 'opened'
    runs-on: ubuntu-latest
    steps:
      - name: Set issue title from website name
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const body = issue.body || '';
            const newline = String.fromCharCode(10);
            const heading = '### 网站名称';
            const start = body.indexOf(heading);
            if (start < 0) return;
            const rest = body.slice(start + heading.length);
            const next = rest.indexOf(newline + '### ');
            const value = (next < 0 ? rest : rest.slice(0, next)).trim();
            const name = /^_No response_$/i.test(value)
              ? ''
              : value.split(newline).join(' ').trim();
            if (!name || issue.title === name) return;
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              title: name
            });

  generate:
    if: github.event.action == 'labeled' && github.event.label.name == '已审核'
    runs-on: ubuntu-latest
    steps:
      - name: Generate resource catalog entry and pull request
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const body = issue.body || '';
            const newline = String.fromCharCode(10);
            const marker = '<!-- resource-automation:' + issue.number + ' -->';
            let permission = 'none';
            try {
              const access = await github.rest.repos.getCollaboratorPermissionLevel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                username: context.actor
              });
              permission = access.data.permission;
            } catch {}
            if (!['admin', 'maintain', 'write'].includes(permission)) {
              return;
            }
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number
            });
            if (comments.some((comment) => (comment.body || '').includes(marker))) {
              return;
            }
            const field = (label) => {
              const heading = '### ' + label;
              const start = body.indexOf(heading);
              if (start < 0) return '';
              const rest = body.slice(start + heading.length);
              const next = rest.indexOf(newline + '### ');
              const value = (next < 0 ? rest : rest.slice(0, next)).trim();
              return /^_No response_$/i.test(value) ? '' : value;
            };
            const oneLine = (value) => String(value || '')
              .split(newline)
              .join(' ')
              .trim();
            const html = (value) => String(value || '')
              .replace(/&/g, '&amp;')
              .replace(/</g, '&lt;')
              .replace(/>/g, '&gt;')
              .replace(/"/g, '&quot;')
              .replace(/'/g, '&#39;');
            const name = oneLine(field('网站名称')) || ('Issue #' + issue.number);
            const url = oneLine(field('网站网址'));
            const type = oneLine(field('资源类型'));
            const category = oneLine(field('分类'));
            const summary = oneLine(field('功能和用法简介'));
            const docs = oneLine(field('使用说明或学习资料链接（可选）'));
            const network = oneLine(field('是否需要科学上网'));
            if (!url || !summary) {
              core.setFailed('Issue 内容缺少网站网址或功能和用法简介');
              return;
            }
            const { owner, repo } = context.repo;
            const repository = await github.rest.repos.get({ owner, repo });
            const base = repository.data.default_branch;
            const baseRef = await github.rest.git.getRef({
              owner,
              repo,
              ref: 'heads/' + base
            });
            const branch = 'resource-issue-' + issue.number;
            let branchSha = baseRef.data.object.sha;
            try {
              const existingBranch = await github.rest.git.getRef({
                owner,
                repo,
                ref: 'heads/' + branch
              });
              branchSha = existingBranch.data.object.sha;
            } catch {
              await github.rest.git.createRef({
                owner,
                repo,
                ref: 'refs/heads/' + branch,
                sha: branchSha
              });
            }
            const catalogPath = 'resource.md';
            const catalogHeader = [
              '# 资源目录',
              '',
              '> 点击分类标题展开，再点击子分类查看资源。每张卡片固定为三行：网站名称、简要介绍、是否需要科学上网。',
              '',
              '<!-- resource-catalog:v1 -->',
              ''
            ].join(newline);
            let catalog = catalogHeader;
            let catalogSha;
            try {
              const existing = await github.rest.repos.getContent({
                owner,
                repo,
                path: catalogPath,
                ref: branch
              });
              if (!Array.isArray(existing.data)) {
                catalogSha = existing.data.sha;
                catalog = Buffer.from(existing.data.content, 'base64').toString('utf8');
              }
            } catch {}
            if (!catalog.includes('<!-- resource-catalog:v1 -->')) {
              catalog = catalogHeader + newline + catalog.trim();
            }
            const categoryParts = (category || '未分类')
              .split('>')
              .map((part) => part.trim())
              .filter(Boolean)  .map((part) => part === '程序员常用' ? '程序员通用' : part)  .filter((part, index, parts) => index === 0 || part !== parts[index - 1]);
            if (!categoryParts.length) categoryParts.push('未分类');
            const categoryStart = (parts) => '<!-- category:' + encodeURIComponent(parts.join(' > ')) + ' -->';
            const categoryEnd = (parts) => '<!-- /category:' + encodeURIComponent(parts.join(' > ')) + ' -->';
            const categoryBlock = (parts) => {
              const block = [
                '<details>',
                '<summary>📁 <strong>' + html(parts[parts.length - 1]) + '</strong></summary>',
                '',
                categoryStart(parts),
                '',
                categoryEnd(parts),
                '</details>'
              ];
              if (parts.length > 1) {
                block.unshift('<blockquote>');
                block.push('</blockquote>');
              }
              return block.join(newline);
            };
            const insertBefore = (source, markerText, insertion) => {
              const index = source.indexOf(markerText);
              if (index < 0) return source.trimEnd() + newline + newline + insertion + newline;
              return source.slice(0, index) + insertion + newline + newline + source.slice(index);
            };
            for (let index = 0; index < categoryParts.length; index += 1) {
              const parts = categoryParts.slice(0, index + 1);
              const startMarker = categoryStart(parts);
              if (catalog.includes(startMarker)) continue;
              const parentEnd = index === 0 ? '' : categoryEnd(parts.slice(0, -1));
              catalog = parentEnd
                ? insertBefore(catalog, parentEnd, categoryBlock(parts))
                : catalog.trimEnd() + newline + newline + categoryBlock(parts) + newline;
            }
            const resourceStart = '<!-- resource:' + issue.number + ' -->';
            const resourceEnd = '<!-- /resource:' + issue.number + ' -->';
            const intro = html(summary) + (docs
              ? '（<a href="' + html(docs) + '">使用说明</a>）'
              : '');
            const resourceBlock = [
              resourceStart,
              '<table>',
              '<tbody>',
              '<tr><td><strong>名称</strong></td><td><a href="' + html(url) + '">' + html(name) + '</a></td></tr>',
              '<tr><td><strong>简介</strong></td><td>' + intro + '</td></tr>',
              '<tr><td><strong>科学上网</strong></td><td>' + html(network || '未填写') + '</td></tr>',
              '</tbody>',
              '</table>',
              resourceEnd
            ].join(newline);
            const oldStart = catalog.indexOf(resourceStart);
            if (oldStart >= 0) {
              const oldEnd = catalog.indexOf(resourceEnd, oldStart);
              if (oldEnd >= 0) {
                catalog = catalog.slice(0, oldStart) + resourceBlock + catalog.slice(oldEnd + resourceEnd.length);
              }
            } else {
              const leafEnd = categoryEnd(categoryParts);
              catalog = insertBefore(catalog, leafEnd, resourceBlock);
            }
            const categoryRecords = [];
            const categoryPattern = /<!-- category:([^ ]+) -->/g;
            for (const match of catalog.matchAll(categoryPattern)) {
              let decodedPath;
              try {
                decodedPath = decodeURIComponent(match[1]);
              } catch {
                continue;
              }
              const parts = decodedPath.split(' > ').map((part) => part.trim()).filter(Boolean);
              const key = parts.join(' > ');
              const endMarker = categoryEnd(parts);
              const endIndex = catalog.indexOf(endMarker, match.index + match[0].length);
              if (!parts.length || !key || endIndex < 0 || categoryRecords.some((record) => record.key === key)) {
                continue;
              }
              categoryRecords.push({
                key,
                parts,
                start: match.index,
                end: endIndex + endMarker.length
              });
            }
            const roots = [];
            const nodesByKey = new Map();
            const getNode = (parts) => {
              const key = parts.join(' > ');
              let node = nodesByKey.get(key);
              if (!node) {
                node = { key, parts, children: [], resources: [] };
                nodesByKey.set(key, node);
                if (parts.length === 1) {
                  roots.push(node);
                } else {
                  const parent = getNode(parts.slice(0, -1));
                  parent.children.push(node);
                }
              }
              return node;
            };
            for (const record of categoryRecords) getNode(record.parts);
            const resourcePattern = /<!-- resource:([^\s]+) -->[\s\S]*?<!-- \/resource:\1 -->/g;
            for (const match of catalog.matchAll(resourcePattern)) {
              const containing = categoryRecords
                .filter((record) => record.start < match.index && match.index < record.end)
                .sort((left, right) => right.parts.length - left.parts.length || right.start - left.start);
              if (containing.length) {
                nodesByKey.get(containing[0].key).resources.push(match[0].trim());
              }
            }
            const renderSortedCategory = (node) => {
              const block = [
                '<details>',
                '<summary>📁 <strong>' + html(node.parts[node.parts.length - 1]) + '</strong></summary>',
                '',
                categoryStart(node.parts),
                ''
              ];
              for (const child of node.children) {
                const childBlock = renderSortedCategory(child);
                block.push(child.parts.length > 1
                  ? '<blockquote>' + newline + childBlock + newline + '</blockquote>'
                  : childBlock);
                block.push('');
              }
              for (const resource of node.resources) {
                block.push(resource, '');
              }
              block.push(categoryEnd(node.parts), '</details>');
              return block.join(newline);
            };
            const firstDetailsIndex = catalog.indexOf('<details>');
            if (roots.length && firstDetailsIndex >= 0) {
              const prefix = catalog.slice(0, firstDetailsIndex).trimEnd();
              catalog = prefix + newline + newline + roots.map(renderSortedCategory).join(newline + newline) + newline;
            }
            const fileUpdate = {
              owner,
              repo,
              path: catalogPath,
              message: 'Update resource catalog from issue #' + issue.number,
              content: Buffer.from(catalog, 'utf8').toString('base64'),
              branch
            };
            if (catalogSha) fileUpdate.sha = catalogSha;
            await github.rest.repos.createOrUpdateFileContents(fileUpdate);
            const formPath = '.github/ISSUE_TEMPLATE/resource.yml';
            let form = '';
            let formSha;
            try {
              const existingForm = await github.rest.repos.getContent({
                owner,
                repo,
                path: formPath,
                ref: branch
              });
              if (!Array.isArray(existingForm.data)) {
                formSha = existingForm.data.sha;
                form = Buffer.from(existingForm.data.content, 'base64').toString('utf8');
              }
            } catch (error) {
              core.warning('读取 Issue Form 失败：' + error.message);
            }
            if (form && formSha) {
              const treeMarkerStart = '<!-- resource-category-tree:start -->';
              const treeMarkerEnd = '<!-- resource-category-tree:end -->';
              const paths = [];
              const markerPattern = /<!-- category:([^ ]+) -->/g;
              for (const match of catalog.matchAll(markerPattern)) {
                let decoded;
                try {
                  decoded = decodeURIComponent(match[1]);
                } catch {
                  continue;
                }
                const parts = decoded.split(' > ').map((part) => part.trim()).filter(Boolean);
                const key = parts.join(' > ');
                if (parts.length && !paths.some((path) => path.join(' > ') === key)) {
                  paths.push(parts);
                }
              }
              const roots = [];
              const findOrCreate = (nodes, name) => {
                let node = nodes.find((item) => item.name === name);
                if (!node) {
                  node = { name, children: [] };
                  nodes.push(node);
                }
                return node;
              };
              for (const parts of paths) {
                let nodes = roots;
                for (const part of parts) {
                  const node = findOrCreate(nodes, part);
                  nodes = node.children;
                }
              }
              const treeLines = [];
              const renderTree = (nodes, prefix, rootLevel) => {
                nodes.forEach((node, index) => {
                  const last = index === nodes.length - 1;
                  treeLines.push(rootLevel
                    ? prefix + node.name
                    : prefix + (last ? '└─ ' : '├─ ') + node.name);
                  if (node.children.length) {
                    renderTree(node.children, rootLevel ? '' : prefix + (last ? '   ' : '│  '), false);
                  }
                });
              };
              renderTree(roots, '', true);
              if (!treeLines.length) treeLines.push('（暂无分类）');
              const fence = String.fromCharCode(96).repeat(3) + 'text';
              const treeLinesWithFence = [
                treeMarkerStart,
                fence,
                ...treeLines,
                String.fromCharCode(96).repeat(3),
                treeMarkerEnd
              ];
              const formLines = form.split(newline);
              const startIndex = formLines.findIndex((line) => line.includes(treeMarkerStart));
              const endIndex = startIndex < 0
                ? -1
                : formLines.findIndex((line, index) => index >= startIndex && line.includes(treeMarkerEnd));
              let updatedForm;
              if (startIndex >= 0 && endIndex >= startIndex) {
                formLines.splice(
                  startIndex,
                  endIndex - startIndex + 1,
                  ...treeLinesWithFence.map((line) => '        ' + line)
                );
                updatedForm = formLines.join(newline);
              } else {
                const categoryIdIndex = formLines.findIndex((line) => line.trim() === 'id: category');
                if (categoryIdIndex < 0) {
                  core.setFailed('Issue Form 缺少 category 字段，无法写入目录树');
                  return;
                }
                let categoryItemIndex = categoryIdIndex;
                while (categoryItemIndex > 0 && !formLines[categoryItemIndex].trim().startsWith('- type:')) {
                  categoryItemIndex -= 1;
                }
                const markdownBlock = [
                  '  - type: markdown',
                  '    attributes:',
                  '      value: |',
                  '        当前目录结构：',
                  '',
                  ...treeLinesWithFence.map((line) => '        ' + line),
                  ''
                ];
                formLines.splice(categoryItemIndex, 0, ...markdownBlock);
                updatedForm = formLines.join(newline);
              }
              if (updatedForm !== form) {
                await github.rest.repos.createOrUpdateFileContents({
                  owner,
                  repo,
                  path: formPath,
                  message: 'Update category tree in issue form from issue #' + issue.number,
                  content: Buffer.from(updatedForm, 'utf8').toString('base64'),
                  sha: formSha,
                  branch
                });
              }
            }
            const openPrs = await github.rest.pulls.list({
              owner,
              repo,
              state: 'open',
              head: owner + ':' + branch
            });
            let pr = openPrs.data[0];
            if (!pr) {
              pr = (await github.rest.pulls.create({
                owner,
                repo,
                title: '更新资源目录：' + name,
                head: branch,
                base,
                body: '由资源 Issue #' + issue.number + ' 添加“已审核”标签后自动生成。'
              })).data;
            }
            try {
              await github.graphql(`
                mutation($pullRequestId: ID!, $mergeMethod: PullRequestMergeMethod!) {
                  enablePullRequestAutoMerge(input: { pullRequestId: $pullRequestId, mergeMethod: $mergeMethod }) {
                    pullRequest { number }
                  }
                }
              `, {
                pullRequestId: pr.node_id,
                mergeMethod: 'SQUASH'
              });
            } catch (error) {
              core.warning('无法开启自动合并：' + error.message);
            }
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: issue.number,
              body: marker + newline + '已生成资源目录 PR：#' + pr.number
            });
