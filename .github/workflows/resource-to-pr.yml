name: Generate resource pull request

on:
  issues:
    types: [opened, labeled]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  sync-title:
    if: github.event.action == 'opened'
    runs-on: ubuntu-latest
    steps:
      - name: Set issue title from website name
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const body = issue.body || '';
            const newline = String.fromCharCode(10);
            const heading = '### 网站名称';
            const start = body.indexOf(heading);
            if (start < 0) return;
            const rest = body.slice(start + heading.length);
            const next = rest.indexOf(newline + '### ');
            const value = (next < 0 ? rest : rest.slice(0, next)).trim();
            const name = /^_No response_$/i.test(value)
              ? ''
              : value.split(newline).join(' ').trim();
            if (!name || issue.title === name) return;
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              title: name
            });

  generate:
    if: github.event.action == 'labeled' && github.event.label.name == '已审核'
    runs-on: ubuntu-latest
    steps:
      - name: Generate resource catalog entry and pull request
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const body = issue.body || '';
            const newline = String.fromCharCode(10);
            const marker = '<!-- resource-automation:' + issue.number + ' -->';
            let permission = 'none';
            try {
              const access = await github.rest.repos.getCollaboratorPermissionLevel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                username: context.actor
              });
              permission = access.data.permission;
            } catch {}
            if (!['admin', 'maintain', 'write'].includes(permission)) {
              return;
            }
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number
            });
            if (comments.some((comment) => (comment.body || '').includes(marker))) {
              return;
            }
            const field = (label) => {
              const heading = '### ' + label;
              const start = body.indexOf(heading);
              if (start < 0) return '';
              const rest = body.slice(start + heading.length);
              const next = rest.indexOf(newline + '### ');
              const value = (next < 0 ? rest : rest.slice(0, next)).trim();
              return /^_No response_$/i.test(value) ? '' : value;
            };
            const oneLine = (value) => String(value || '')
              .split(newline)
              .join(' ')
              .trim();
            const html = (value) => String(value || '')
              .replace(/&/g, '&amp;')
              .replace(/</g, '&lt;')
              .replace(/>/g, '&gt;')
              .replace(/"/g, '&quot;')
              .replace(/'/g, '&#39;');
            const name = oneLine(field('网站名称')) || ('Issue #' + issue.number);
            const url = oneLine(field('网站网址'));
            const type = oneLine(field('资源类型'));
            const category = oneLine(field('分类'));
            const summary = oneLine(field('功能和用法简介'));
            const docs = oneLine(field('使用说明或学习资料链接（可选）'));
            const network = oneLine(field('是否需要科学上网'));
            if (!url || !summary) {
              core.setFailed('Issue 内容缺少网站网址或功能和用法简介');
              return;
            }
            const { owner, repo } = context.repo;
            const repository = await github.rest.repos.get({ owner, repo });
            const base = repository.data.default_branch;
            const baseRef = await github.rest.git.getRef({
              owner,
              repo,
              ref: 'heads/' + base
            });
            const branch = 'resource-issue-' + issue.number;
            let branchSha = baseRef.data.object.sha;
            try {
              const existingBranch = await github.rest.git.getRef({
                owner,
                repo,
                ref: 'heads/' + branch
              });
              branchSha = existingBranch.data.object.sha;
            } catch {
              await github.rest.git.createRef({
                owner,
                repo,
                ref: 'refs/heads/' + branch,
                sha: branchSha
              });
            }
            const catalogPath = 'resource.md';
            const catalogHeader = [
              '# 资源目录',
              '',
              '> 点击分类标题展开，再点击子分类查看资源。每张卡片固定为三行：网站名称、简要介绍、是否需要科学上网。',
              '',
              '<!-- resource-catalog:v1 -->',
              ''
            ].join(newline);
            let catalog = catalogHeader;
            let catalogSha;
            try {
              const existing = await github.rest.repos.getContent({
                owner,
                repo,
                path: catalogPath,
                ref: branch
              });
              if (!Array.isArray(existing.data)) {
                catalogSha = existing.data.sha;
                catalog = Buffer.from(existing.data.content, 'base64').toString('utf8');
              }
            } catch {}
            if (!catalog.includes('<!-- resource-catalog:v1 -->')) {
              catalog = catalogHeader + newline + catalog.trim();
            }
            const categoryParts = (category || '未分类')
              .split('>')
              .map((part) => part.trim())
              .filter(Boolean);
            if (!categoryParts.length) categoryParts.push('未分类');
            const categoryStart = (parts) => '<!-- category:' + encodeURIComponent(parts.join(' > ')) + ' -->';
            const categoryEnd = (parts) => '<!-- /category:' + encodeURIComponent(parts.join(' > ')) + ' -->';
            const categoryBlock = (parts) => [
              '<details>',
              '<summary>📁 <strong>' + html(parts[parts.length - 1]) + '</strong></summary>',
              '',
              categoryStart(parts),
              '',
              categoryEnd(parts),
              '</details>'
            ].join(newline);
            const insertBefore = (source, markerText, insertion) => {
              const index = source.indexOf(markerText);
              if (index < 0) return source.trimEnd() + newline + newline + insertion + newline;
              return source.slice(0, index) + insertion + newline + newline + source.slice(index);
            };
            for (let index = 0; index < categoryParts.length; index += 1) {
              const parts = categoryParts.slice(0, index + 1);
              const startMarker = categoryStart(parts);
              if (catalog.includes(startMarker)) continue;
              const parentEnd = index === 0 ? '' : categoryEnd(parts.slice(0, -1));
              catalog = parentEnd
                ? insertBefore(catalog, parentEnd, categoryBlock(parts))
                : catalog.trimEnd() + newline + newline + categoryBlock(parts) + newline;
            }
            const resourceStart = '<!-- resource:' + issue.number + ' -->';
            const resourceEnd = '<!-- /resource:' + issue.number + ' -->';
            const intro = html(summary) + (docs
              ? '（<a href="' + html(docs) + '">使用说明</a>）'
              : '');
            const resourceBlock = [
              resourceStart,
              '<table>',
              '<tbody>',
              '<tr><td><strong>名称</strong></td><td><a href="' + html(url) + '">' + html(name) + '</a></td></tr>',
              '<tr><td><strong>简介</strong></td><td>' + intro + '</td></tr>',
              '<tr><td><strong>科学上网</strong></td><td>' + html(network || '未填写') + '</td></tr>',
              '</tbody>',
              '</table>',
              resourceEnd
            ].join(newline);
            const oldStart = catalog.indexOf(resourceStart);
            if (oldStart >= 0) {
              const oldEnd = catalog.indexOf(resourceEnd, oldStart);
              if (oldEnd >= 0) {
                catalog = catalog.slice(0, oldStart) + resourceBlock + catalog.slice(oldEnd + resourceEnd.length);
              }
            } else {
              const leafEnd = categoryEnd(categoryParts);
              catalog = insertBefore(catalog, leafEnd, resourceBlock);
            }
            const fileUpdate = {
              owner,
              repo,
              path: catalogPath,
              message: 'Update resource catalog from issue #' + issue.number,
              content: Buffer.from(catalog, 'utf8').toString('base64'),
              branch
            };
            if (catalogSha) fileUpdate.sha = catalogSha;
            await github.rest.repos.createOrUpdateFileContents(fileUpdate);
            const openPrs = await github.rest.pulls.list({
              owner,
              repo,
              state: 'open',
              head: owner + ':' + branch
            });
            let pr = openPrs.data[0];
            if (!pr) {
              pr = (await github.rest.pulls.create({
                owner,
                repo,
                title: '更新资源目录：' + name,
                head: branch,
                base,
                body: '由资源 Issue #' + issue.number + ' 添加“已审核”标签后自动生成。'
              })).data;
            }
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: issue.number,
              body: marker + newline + '已生成资源目录 PR：#' + pr.number
            });
