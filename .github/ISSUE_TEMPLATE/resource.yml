name: 提交资源
description: 推荐一个值得分享的网站、工具或学习资料
title: "资源提交"
labels:
  - 待审核
body:
  - type: markdown
    attributes:
      value: |
        这栏不用填，系统自动生成。
  - type: input
    id: name
    attributes:
      label: 网站名称
      description: 资源的正式名称。
      placeholder: 例如：某某在线工具
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: 网站网址
      description: 请填写完整的网址，建议使用 HTTPS。
      placeholder: https://example.com
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        当前目录结构：

        <!-- resource-category-tree:start -->
        ```text
        CTF
        └─ 工具
           ├─ 然后呢
           └─ 工具
              └─ 工具
        CCF
        CBB
        ```
        <!-- resource-category-tree:end -->

  - type: input
    id: category
    attributes:
      label: 分类
      description: '请按“大分类 > 小分类”填写；目录以仓库根目录 resource.md 的最新内容为准，审核时会统一调整。'
      placeholder: 例如：CTF > 工具
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: 功能和用法简介
      description: 必须说明这是一个纯网页学习网站，还是资源下载网站，并简要说明它能做什么以及适合谁使用。
      placeholder: 这是一个……，可以用来……
    validations:
      required: true
  - type: dropdown
    id: network
    attributes:
      label: 是否需要科学上网
      options:
        - 不需要
        - 需要
        - 部分内容需要
        - 不确定
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: 提交确认
      options:
        - label: 我已确认该网址合法、安全，并且内容确实有分享价值。
          required: true
