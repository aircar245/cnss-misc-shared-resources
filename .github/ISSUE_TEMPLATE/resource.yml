name: 提交资源
description: 推荐一个值得分享的网站、工具或学习资料
title: "资源提交"
labels:
  - 待审核
body:
  - type: markdown
    attributes:
      value: |
        感谢分享！请尽量填写完整，方便审核后直接展示。

        ↑这一栏不用写，系统会自己填标题。
  - type: input
    id: name
    attributes:
      label: 网站名称
      description: 资源的正式名称。
      placeholder: 例如：某某在线工具
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: 网站网址
      description: 请填写完整的网址，建议使用 HTTPS。
      placeholder: https://example.com
    validations:
      required: true
  - type: dropdown
    id: type
    attributes:
      label: 资源类型
      options:
        - 工具
        - 学习资料
        - 社区
        - 平台
        - 其他
    validations:
      required: true
  - type: input
    id: category
    attributes:
      label: 分类
      description: 优先填写已有分类，格式为“大分类 > 小分类”，例如“CTF > 工具”。
      placeholder: CTF > 工具
    validations:
      required: true
  - type: textarea
    id: new_category
    attributes:
      label: 新分类建议（可选）
      description: 如果没有合适分类，请填写建议新增的分类，并说明理由。
      placeholder: 建议新增：大分类 > 小分类
  - type: textarea
    id: summary
    attributes:
      label: 功能和用法简介
      description: 用一句话说明它能做什么，以及适合谁使用。
      placeholder: 这是一个……，可以用来……
    validations:
      required: true
  - type: input
    id: docs
    attributes:
      label: 使用说明或学习资料链接（可选）
      description: 工具类资源建议填写官方文档、教程或使用说明。
      placeholder: https://example.com/docs
  - type: dropdown
    id: network
    attributes:
      label: 是否需要科学上网
      options:
        - 不需要
        - 需要
        - 部分内容需要
        - 不确定
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: 提交确认
      options:
        - label: 我已确认该网址合法、安全，并且内容确实有分享价值。
          required: true
