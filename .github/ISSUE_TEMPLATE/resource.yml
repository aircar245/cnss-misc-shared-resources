name: 提交资源
description: 推荐一个值得分享的网站、工具或学习资料
title: "资源提交"
labels:
  - 待审核
body:
  - type: markdown
    attributes:
      value: |
        感谢分享！请尽量填写完整，方便审核后直接展示。

        网站名称会在提交后自动同步为 Issue 标题；标题栏是 GitHub 固定项，无法删除。
  - type: input
    id: name
    attributes:
      label: 网站名称
      description: 资源的正式名称。
      placeholder: 例如：某某在线工具
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: 网站网址
      description: 请填写完整的网址，建议使用 HTTPS。
      placeholder: https://example.com
    validations:
      required: true
  - type: input
    id: category
    attributes:
      label: 分类
      description: '当前目录可在 [resource.md](https://github.com/aircar245/cnss-misc-shared-resource/blob/main/resource.md) 查看；优先填写已有分类，格式为“大分类 > 小分类”，例如“CTF > 工具”。'
      placeholder: CTF > 工具
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: 功能和用法简介
      description: 必须说明这是一个纯网页学习网站，还是资源下载网站，并简要说明它能做什么以及适合谁使用。
      placeholder: 这是一个……，可以用来……
    validations:
      required: true
  - type: dropdown
    id: network
    attributes:
      label: 是否需要科学上网
      options:
        - 不需要
        - 需要
        - 部分内容需要
        - 不确定
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: 提交确认
      options:
        - label: 我已确认该网址合法、安全，并且内容确实有分享价值。
          required: true
